name: Selected backend consumer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-policy:
    name: Credential boundary policy
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, beep-vm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B ci/test_workflow_policy.py
  consumer:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, beep-vm]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [core, postgresql, mysql, mariadb, sqlite, duckdb]
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/single-backend/run "${{ matrix.backend }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-${{ matrix.backend }}
          path: single-backend-evidence
