[tools]
perl = "5.40.2"

[tasks.test]
description = "Run the native Perl unit suite"
run = "script/with-local-deps prove -lr t"

[tasks.build]
description = "Build the CPAN-style distribution metadata"
run = "script/with-local-deps sh -c 'perl Makefile.PL && make'"

[tasks.verify]
description = "Run syntax checks, tests, and distribution build"
run = "script/with-local-deps sh -c 'perl -Ilib -c bin/selecto-certify && prove -lr t && perl Makefile.PL && make test'"
