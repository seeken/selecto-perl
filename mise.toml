[tools]
perl = "5.40.2"

[tasks.test]
description = "Run the native Perl unit suite"
run = "script/with-local-deps mise exec -- perl -S prove -lr t"

[tasks.build]
description = "Build the CPAN-style distribution metadata"
run = "script/with-local-deps sh -c 'mise exec -- perl Makefile.PL && make'"

[tasks.verify]
description = "Run syntax checks, tests, and distribution build"
run = "script/with-local-deps sh -c 'mise exec -- perl -Ilib -c bin/selecto-certify && mise exec -- perl -S prove -lr t && mise exec -- perl Makefile.PL && make test'"
